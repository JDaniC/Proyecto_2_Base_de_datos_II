  parameters:
    Idempotencia:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID estable por intención; todas las mutaciones clínicas. Misma clave y hash reproducen resultado
        durable; hash distinto → 409 CLAVE_REUTILIZADA.
      schema:
        $ref: '#/components/schemas/UUID'
  responses:
    Error400:
      description: Entrada, fecha, cursor o campo de autoridad inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error400'
          example:
            error:
              codigo: SOLICITUD_INVALIDA
              mensaje: Entrada, fecha, cursor o campo de autoridad inválido.
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
    Error401:
      description: Token ausente, inválido, vencido o revocado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error401'
          example:
            error:
              codigo: NO_AUTENTICADO
              mensaje: Token ausente, inválido, vencido o revocado.
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
    Error403:
      description: Permiso/capacidad ausente o cuenta no habilitada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error403'
          example:
            error:
              codigo: SIN_PERMISO
              mensaje: Permiso/capacidad ausente o cuenta no habilitada.
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
    Error404:
      description: Inexistente o ajeno; no revelar existencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error404'
          example:
            error:
              codigo: RECURSO_NO_ENCONTRADO
              mensaje: Inexistente o ajeno; no revelar existencia.
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
    Error409:
      description: Conflicto de versión, clave, estado, identidad o referencia; cero efectos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error409'
          example:
            error:
              codigo: ESTADO_INVALIDO
              mensaje: Conflicto de versión, clave, estado, identidad o referencia; cero efectos.
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
    Error413:
      description: Más de 262144 bytes UTF-8 o más de 100 elementos; no truncar.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error413'
          example:
            error:
              codigo: LIMITE_AGREGADO
              mensaje: Más de 262144 bytes UTF-8 o más de 100 elementos; no truncar.
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
    Error500:
      description: Rollback, mensaje neutral, correlación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error500'
          example:
            error:
              codigo: ERROR_INTERNO
              mensaje: Rollback, mensaje neutral, correlación.
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
    Error503:
      description: 'Dependencia no disponible o commit incierto: reconciliar misma clave.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error503'
          example:
            error:
              codigo: PERSISTENCIA_NO_DISPONIBLE
              mensaje: 'Dependencia no disponible o commit incierto: reconciliar misma clave.'
            meta:
              correlacion: 00000000-0000-4000-8000-000000000090
