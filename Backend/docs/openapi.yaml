components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: Verificación de firma/emisor/audiencia/vencimiento/revocación más cuenta local/roles actuales.
        Sin autoridad enviada por cliente.
  schemas:
    UUID:
      type: string
      format: uuid
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
    Version:
      type: integer
      minimum: 1
      maximum: 9007199254740991
    FechaCivil:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
    InstanteUTC:
      type: string
      format: date-time
      pattern: Z$
    HoraCivil:
      type: string
      pattern: ^([01]\d|2[0-3]):[0-5]\d$
    Cursor:
      type: string
      minLength: 1
      maxLength: 2048
      pattern: ^[A-Za-z0-9_-]+$
    Institucion:
      type: string
      enum:
      - HOSPITAL_GENERAL
      - CLINICA_ODONTOLOGICA
      - LABORATORIO_CLINICO
      - CENTRO_MEDICO_PEDIATRICO
    Rol:
      type: string
      enum:
      - ADMIN_INSTITUCIONAL
      - SECRETARIA
      - MEDICO
      - ODONTOLOGO
      - PEDIATRA
      - MEDICO_LABORATORIO
      - ANALISTA_LABORATORIO
      - VALIDADOR_LABORATORIO
    Permiso:
      type: string
      enum:
      - pacientes.administrar
      - historial.leer
      - historial.archivar
      - citas.administrar
      - consultas.registrar
      - diagnosticos.registrar
      - tratamientos.registrar
      - recetas.emitir
      - usuarios.administrar
      - auditoria.leer
      - resultados.analizar
      - resultados.validar
      - informes.emitir
      - cobros.administrar
      - inventario.administrar
      - ordenes.administrar
      - muestras.administrar
    Meta:
      type: object
      additionalProperties: false
      properties:
        correlacion:
          $ref: '#/components/schemas/UUID'
        siguiente_cursor:
          $ref: '#/components/schemas/Cursor'
      required:
      - correlacion
    Error:
      type: object
      additionalProperties: false
      properties:
        error:
          type: object
          additionalProperties: false
          properties:
            codigo:
              type: string
              enum:
              - SOLICITUD_INVALIDA
              - NO_AUTENTICADO
              - CUENTA_NO_HABILITADA
              - SIN_PERMISO
              - RECURSO_NO_ENCONTRADO
              - PACIENTE_DUPLICADO
              - CLAVE_REUTILIZADA
              - VERSION_DESACTUALIZADA
              - ESTADO_INVALIDO
              - REFERENCIA_INCOMPATIBLE
              - RECETA_EXISTENTE
              - CITA_SOLAPADA
              - CAMA_NO_DISPONIBLE
              - STOCK_INSUFICIENTE
              - SALDO_INSUFICIENTE
              - DOSIS_DUPLICADA
              - LIMITE_AGREGADO
              - PERSISTENCIA_NO_DISPONIBLE
              - IDENTIDAD_NO_DISPONIBLE
              - ARCHIVO_NO_DISPONIBLE
              - ERROR_INTERNO
            mensaje:
              type: string
              minLength: 1
              maxLength: 300
              pattern: \S
            campos:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  campo:
                    type: string
                    minLength: 1
                    maxLength: 100
                    pattern: \S
                  codigo:
                    type: string
                    enum:
                    - REQUERIDO
                    - FORMATO
                    - RANGO
                    - NO_PERMITIDO
                required:
                - campo
                - codigo
              minItems: 0
              maxItems: 100
          required:
          - codigo
          - mensaje
        meta:
          $ref: '#/components/schemas/Meta'
      required:
      - error
      - meta
    Dinero:
      type: object
      additionalProperties: false
      properties:
        centavos:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        moneda:
          type: string
          enum:
          - GTQ
      required:
      - centavos
      - moneda
    Profesional:
      type: object
      additionalProperties: false
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        rol:
          $ref: '#/components/schemas/Rol'
        activo:
          const: true
      required:
      - id
      - nombre
      - rol
      - activo
    Sesion:
      type: object
      additionalProperties: false
      properties:
        cuenta_id:
          $ref: '#/components/schemas/UUID'
        institucion:
          $ref: '#/components/schemas/Institucion'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Rol'
          minItems: 1
          maxItems: 100
        permisos:
          type: array
          items:
            $ref: '#/components/schemas/Permiso'
          minItems: 0
          maxItems: 100
        profesional:
          $ref: '#/components/schemas/Profesional'
        version:
          $ref: '#/components/schemas/Version'
      required:
      - cuenta_id
      - institucion
      - roles
      - permisos
      - version
    CierreSesion:
      type: object
      additionalProperties: false
      properties:
        cerrada:
          const: true
      required:
      - cerrada
    Contacto:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        parentesco:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        telefono:
          type: string
          minLength: 1
          maxLength: 30
          pattern: \S
      required:
      - nombre
      - parentesco
      - telefono
    Identificacion:
      type: object
      additionalProperties: false
      properties:
        tipo:
          type: string
          enum:
          - CUI
          - PASAPORTE
        numero:
          type: string
          minLength: 1
          maxLength: 40
          pattern: \S
      required:
      - tipo
      - numero
    VinculoResponsable:
      type: object
      additionalProperties: false
      properties:
        responsable_id:
          $ref: '#/components/schemas/UUID'
        version_responsable:
          $ref: '#/components/schemas/Version'
        parentesco:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        es_principal:
          type: boolean
        autoriza_atencion:
          type: boolean
      required:
      - responsable_id
      - version_responsable
      - parentesco
      - es_principal
      - autoriza_atencion
    NuevoResponsable:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 200
          pattern: \S
        documento:
          $ref: '#/components/schemas/Identificacion'
        telefono:
          type: string
          minLength: 1
          maxLength: 30
          pattern: \S
        parentesco:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        es_principal:
          type: boolean
        autoriza_atencion:
          type: boolean
      required:
      - nombre
      - telefono
      - parentesco
      - es_principal
      - autoriza_atencion
    ResponsableAlta:
      oneOf:
      - $ref: '#/components/schemas/VinculoResponsable'
      - $ref: '#/components/schemas/NuevoResponsable'
    AltaPaciente:
      type: object
      additionalProperties: false
      properties:
        nombres: &id009
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        apellidos: &id010
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        fecha_nacimiento: &id011
          $ref: '#/components/schemas/FechaCivil'
        sexo: &id012
          type: string
          enum:
          - MASCULINO
          - FEMENINO
          - OTRO
        identificacion: &id013
          $ref: '#/components/schemas/Identificacion'
        telefono: &id014
          type: string
          maxLength: 30
        correo: &id015
