openapi: 3.1.0
info:
  title: Entrega II — contrato común
  version: 1.0.0
  description: E00-P1-03. Especificación, no implementación. Extensiones institucionales se congelan en E04/E05
    antes de conectarlas. Solo datos sintéticos en ejemplos.
servers:
- url: /api/v1
security:
- FirebaseBearer: []
x-limites:
  max_bytes_utf8: 262144
  max_items: 100
  max_intentos_transitorios: 3
paths:
  /sesion:
    post:
      operationId: sesionEstablecer
      summary: sesionEstablecer
      description: Firebase Auth inicia sesión en cliente. Verificar Bearer con revocación y cuenta local; sin email/password,
        selector de institución ni cookie alternativa.
      tags:
      - sesion
      x-permisos: []
      x-instituciones: &id001
      - HOSPITAL_GENERAL
      - CLINICA_ODONTOLOGICA
      - LABORATORIO_CLINICO
      - CENTRO_MEDICO_PEDIATRICO
      x-implementacion: NOT_IMPLEMENTED
      parameters: []
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSesion'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    get:
      operationId: sesionActual
      summary: sesionActual
      description: Ámbito institucional y autorización de la cuenta verificada; no acepta autoridad del cliente.
      tags:
      - sesion
      x-permisos: []
      x-instituciones: *id001
      x-implementacion: NOT_IMPLEMENTED
      parameters: []
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSesion'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /sesion/cierre:
    post:
      operationId: sesionCerrar
      summary: sesionCerrar
      description: Revocar refresh tokens del UID verificado fuera de UoW clínica (E01-P1-03); rechazar ID tokens
        revocados. Después el cliente ejecuta signOut. Si Auth falla responder 503 IDENTIDAD_NO_DISPONIBLE; no afirmar
        cierre global.
      tags:
      - sesion
      x-permisos: []
      x-instituciones: *id001
      x-implementacion: NOT_IMPLEMENTED
      parameters: []
      responses:
        '200':
