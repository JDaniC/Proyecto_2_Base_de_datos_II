openapi: 3.1.0
info:
  title: Entrega II — contrato común
  version: 1.0.0
  description: Contrato API v1. El campo x-implementacion distingue rutas conectadas de las pendientes por fase.
    Extensiones institucionales se congelan en E04/E05 antes de conectarlas. Solo datos sintéticos en ejemplos.
servers:
- url: /api/v1
security:
- FirebaseBearer: []
x-limites:
  max_bytes_utf8: 262144
  max_items: 100
  max_intentos_transitorios: 3
x-respuestas-error-laboratorio: &erroresLaboratorio
  '400': { $ref: '#/components/responses/Error400' }
  '401': { $ref: '#/components/responses/Error401' }
  '403': { $ref: '#/components/responses/Error403' }
  '404': { $ref: '#/components/responses/Error404' }
  '409': { $ref: '#/components/responses/Error409' }
  '413': { $ref: '#/components/responses/Error413' }
  '500': { $ref: '#/components/responses/Error500' }
  '503': { $ref: '#/components/responses/Error503' }
paths:
  /laboratorio/ordenes:
    get:
      operationId: laboratorioOrdenListar
      summary: Lista órdenes de laboratorio con cursor autenticado.
      tags: [laboratorio]
      x-permisos: [ordenes.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters:
      - {name: pacienteId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: estado, in: query, schema: {type: string, enum: [CREADA, EN_PROCESO, COMPLETADA, CANCELADA]}}
      - {name: desde, in: query, schema: {$ref: '#/components/schemas/InstanteUTC'}}
      - {name: hasta, in: query, schema: {$ref: '#/components/schemas/InstanteUTC'}}
      - {name: limite, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: orden, in: query, schema: {type: string, enum: [ASC, DESC], default: DESC}}
      - {name: cursor, in: query, schema: {$ref: '#/components/schemas/Cursor'}}
      responses:
        '200': {description: Página coherente de órdenes.}
        <<: *erroresLaboratorio
    post:
      operationId: laboratorioOrdenCrear
      summary: Crea una orden y congela pruebas y precios en una UoW.
      tags: [laboratorio]
      x-permisos: [ordenes.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioOrdenCrear'}}}}
      responses:
        '201': {description: Orden confirmada o replay durable.}
        <<: *erroresLaboratorio
  /laboratorio/ordenes/{id}:
    get:
      operationId: laboratorioOrdenDetalle
      summary: Obtiene el snapshot exacto de una orden.
      tags: [laboratorio]
      x-permisos: [ordenes.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
      responses:
        '200': {description: Orden encontrada.}
        <<: *erroresLaboratorio
  /laboratorio/muestras:
    get:
      operationId: laboratorioMuestraListar
      summary: Lista muestras con sus eventos desde un snapshot coherente.
      tags: [laboratorio]
      x-permisos: [muestras.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters:
      - {name: pacienteId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: ordenId, in: query, schema: {$ref: '#/components/schemas/UUID'}}
      - {name: estado, in: query, schema: {type: string, enum: [TOMADA, RECIBIDA, ACEPTADA, RECHAZADA, PROCESADA]}}
      - {name: desde, in: query, schema: {$ref: '#/components/schemas/InstanteUTC'}}
      - {name: hasta, in: query, schema: {$ref: '#/components/schemas/InstanteUTC'}}
      - {name: limite, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: orden, in: query, schema: {type: string, enum: [ASC, DESC], default: DESC}}
      - {name: cursor, in: query, schema: {$ref: '#/components/schemas/Cursor'}}
      responses:
        '200': {description: Página coherente de muestras.}
        <<: *erroresLaboratorio
    post:
      operationId: laboratorioMuestraTomar
      summary: Registra la toma y reserva la revisión de la orden.
      tags: [laboratorio]
      x-permisos: [muestras.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioMuestraTomar'}}}}
      responses:
        '201': {description: Muestra y evento confirmados.}
        <<: *erroresLaboratorio
  /laboratorio/muestras/{id}:
    get:
      operationId: laboratorioMuestraDetalle
      summary: Obtiene una muestra y toda su cadena de custodia.
      tags: [laboratorio]
      x-permisos: [muestras.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}]
      responses:
        '200': {description: Muestra encontrada.}
        <<: *erroresLaboratorio
  /laboratorio/muestras/{id}/eventos:
    post:
      operationId: laboratorioMuestraEvento
      summary: Añade un evento válido a la cadena de custodia.
      tags: [laboratorio]
      x-permisos: [muestras.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}, {$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioMuestraEvento'}}}}
      responses:
        '200': {description: Evento confirmado.}
        <<: *erroresLaboratorio
  /laboratorio/muestras/{id}/rectificaciones:
    post:
      operationId: laboratorioMuestraRectificar
      summary: Rectifica un dato conservando antes, después y motivo.
      tags: [laboratorio]
      x-permisos: [muestras.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}, {$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioMuestraRectificar'}}}}
      responses:
        '200': {description: Rectificación confirmada.}
        <<: *erroresLaboratorio
  /laboratorio/muestras/{id}/retomas:
    post:
      operationId: laboratorioMuestraRetomar
      summary: Crea una nueva muestra enlazada al origen rechazado.
      tags: [laboratorio]
      x-permisos: [muestras.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}, {$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioMuestraRetomar'}}}}
      responses:
        '201': {description: Retoma confirmada.}
        <<: *erroresLaboratorio
  /laboratorio/catalogos/{tipo}:
    get:
      operationId: laboratorioCatalogoListar
      summary: Lista referencias vigentes o históricas por capacidad.
      tags: [laboratorio]
      x-permisos: [ordenes.administrar|muestras.administrar|resultados.analizar|resultados.validar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters:
      - {name: tipo, in: path, required: true, schema: {type: string, enum: [solicitantes, tipos-muestra, metodos, pruebas, proveedores]}}
      - {name: q, in: query, schema: {type: string, minLength: 1, maxLength: 120}}
      - {name: activo, in: query, schema: {type: boolean}}
      - {name: limite, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      - {name: orden, in: query, schema: {type: string, enum: [ASC, DESC], default: ASC}}
      - {name: cursor, in: query, schema: {$ref: '#/components/schemas/Cursor'}}
      responses:
        '200': {description: Página de catálogo.}
        <<: *erroresLaboratorio
  /laboratorio/pruebas:
    post:
      operationId: laboratorioPruebaPublicar
      summary: Publica una versión inmutable de prueba.
      tags: [laboratorio]
      x-permisos: [resultados.validar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioPruebaPublicar'}}}}
      responses:
        '201': {description: Versión publicada.}
        <<: *erroresLaboratorio
  /laboratorio/pruebas/{id}/estado:
    patch:
      operationId: laboratorioPruebaEstado
      summary: Activa o desactiva una versión sin alterar su contenido.
      tags: [laboratorio]
      x-permisos: [resultados.validar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}, {$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioVersionEstado'}}}}
      responses:
        '200': {description: Estado y revisión actualizados.}
        <<: *erroresLaboratorio
  /laboratorio/metodos:
    post:
      operationId: laboratorioMetodoPublicar
      summary: Publica una versión inmutable de método.
      tags: [laboratorio]
      x-permisos: [resultados.validar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioMetodoPublicar'}}}}
      responses:
        '201': {description: Versión publicada.}
        <<: *erroresLaboratorio
  /laboratorio/metodos/{id}/estado:
    patch:
      operationId: laboratorioMetodoEstado
      summary: Activa o desactiva un método sin alterar su contenido.
      tags: [laboratorio]
      x-permisos: [resultados.validar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}, {$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioVersionEstado'}}}}
      responses:
        '200': {description: Estado y revisión actualizados.}
        <<: *erroresLaboratorio
  /laboratorio/referencias/{tipo}:
    post:
      operationId: laboratorioReferenciaCrear
      summary: Crea una referencia administrativa tipada.
      tags: [laboratorio]
      x-permisos: [ordenes.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: tipo, in: path, required: true, schema: {type: string, enum: [solicitantes, tipos-muestra, proveedores]}}, {$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioReferenciaCrear'}}}}
      responses:
        '201': {description: Referencia creada.}
        <<: *erroresLaboratorio
  /laboratorio/referencias/{tipo}/{id}:
    patch:
      operationId: laboratorioReferenciaActualizar
      summary: Sustituye la revisión vigente conservando la anterior.
      tags: [laboratorio]
      x-permisos: [ordenes.administrar]
      x-instituciones: [LABORATORIO_CLINICO]
      x-implementacion: IMPLEMENTED
      parameters: [{name: tipo, in: path, required: true, schema: {type: string, enum: [solicitantes, tipos-muestra, proveedores]}}, {name: id, in: path, required: true, schema: {$ref: '#/components/schemas/UUID'}}, {$ref: '#/components/parameters/Idempotencia'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/LaboratorioReferenciaActualizar'}}}}
      responses:
        '200': {description: Referencia actualizada.}
        <<: *erroresLaboratorio
  /sesion:
    post:
      operationId: sesionEstablecer
      summary: sesionEstablecer
      description: Firebase Auth inicia sesión en cliente. Verificar Bearer con revocación y cuenta local; sin email/password,
        selector de institución ni cookie alternativa.
      tags:
      - sesion
      x-permisos: []
      x-instituciones: &id001
      - HOSPITAL_GENERAL
      - CLINICA_ODONTOLOGICA
      - LABORATORIO_CLINICO
      - CENTRO_MEDICO_PEDIATRICO
      x-implementacion: IMPLEMENTED
      parameters: []
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSesion'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    get:
      operationId: sesionActual
      summary: sesionActual
      description: Ámbito institucional y autorización de la cuenta verificada; no acepta autoridad del cliente.
      tags:
      - sesion
      x-permisos: []
      x-instituciones: *id001
      x-implementacion: IMPLEMENTED
      parameters: []
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaSesion'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /sesion/cierre:
    post:
      operationId: sesionCerrar
      summary: sesionCerrar
      description: Revocar refresh tokens del UID verificado fuera de UoW clínica (E01-P1-03); rechazar ID tokens
        revocados. Después el cliente ejecuta signOut. Si Auth falla responder 503 IDENTIDAD_NO_DISPONIBLE; no afirmar
        cierre global.
      tags:
      - sesion
      x-permisos: []
      x-instituciones: *id001
      x-implementacion: IMPLEMENTED
      parameters: []
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCierreSesion'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
  /pacientes:
    post:
      operationId: pacienteCrear
      summary: pacienteCrear
      description: Alta e historial/reservas/auditoría atómicos. Pediatría valida AltaPediatrica; odontología admite
        identificación ausente. Responsables nuevos se crean y vinculan atómicamente, existentes se referencian
        y revalidan.
      tags:
      - pacientes
      x-permisos:
      - pacientes.administrar
      x-instituciones: *id001
      x-implementacion: NOT_IMPLEMENTED
      parameters:
      - $ref: '#/components/parameters/Idempotencia'
      responses:
        '201':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaciente'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AltaPaciente'
      x-esquemas-institucionales:
        CENTRO_MEDICO_PEDIATRICO:
          $ref: '#/components/schemas/AltaPediatrica'
        CLINICA_ODONTOLOGICA:
          $ref: '#/components/schemas/AltaDental'
    get:
      operationId: pacienteBuscar
      summary: pacienteBuscar
      description: Ámbito institucional y autorización de la cuenta verificada; no acepta autoridad del cliente.
      tags:
      - pacientes
      x-permisos:
      - pacientes.administrar|historial.leer
      x-instituciones: *id001
      x-implementacion: NOT_IMPLEMENTED
      parameters:
      - name: cursor
        in: query
        required: false
        schema: &id002
          $ref: '#/components/schemas/Cursor'
      - name: limite
        in: query
        required: false
        schema: &id003
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: orden
        in: query
        required: false
        schema: &id004
          type: string
          enum:
          - ASC
          - DESC
          default: ASC
      - name: q
        in: query
        required: true
        schema: &id033
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
      - name: estado
        in: query
        required: false
        schema: &id034
          type: string
          enum:
          - ACTIVO
          - ARCHIVADO
          - TODOS
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPacientes'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      x-query-schema:
        $ref: '#/components/schemas/BuscarPacientes'
  /pacientes/{id}:
    get:
      operationId: pacienteObtener
      summary: pacienteObtener
      description: Ámbito institucional y autorización de la cuenta verificada; no acepta autoridad del cliente.
      tags:
      - pacientes
      x-permisos:
      - pacientes.administrar|historial.leer
      x-instituciones: *id001
      x-implementacion: NOT_IMPLEMENTED
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaciente'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
    patch:
      operationId: pacienteActualizar
      summary: pacienteActualizar
      description: 'PATCH parcial de demografía: omisión conserva, null elimina opcionales; obligatorios no admiten
        null. Comando conserva historial previo y actualiza/libera reserva de identidad atómicamente. No modifica
        vínculos de responsables.'
      tags:
      - pacientes
      x-permisos:
      - pacientes.administrar
      x-instituciones: *id001
      x-implementacion: NOT_IMPLEMENTED
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - $ref: '#/components/parameters/Idempotencia'
      responses:
        '200':
          description: Resultado confirmado; una repetición idempotente conserva código HTTP y cuerpo originales.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaciente'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioPaciente'
  /pacientes/{id}/historial:
    get:
      operationId: pacienteHistorial
      summary: pacienteHistorial
      description: Ámbito institucional y autorización de la cuenta verificada; no acepta autoridad del cliente.
      tags:
      - pacientes
      x-permisos:
      - historial.leer
      x-instituciones: *id001
      x-implementacion: IMPLEMENTED
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - name: cursor
        in: query
        required: false
        schema: *id002
      - name: limite
        in: query
        required: false
        schema: *id003
      - name: orden
        in: query
        required: false
        schema: *id004
      - name: desde
        in: query
        required: false
        schema: &id005
          $ref: '#/components/schemas/InstanteUTC'
      - name: hasta
        in: query
        required: false
        schema: &id006
