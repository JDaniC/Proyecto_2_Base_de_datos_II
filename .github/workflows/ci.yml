name: Validación del proyecto
on:
  pull_request:
    branches: [Develop, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [Develop, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  contrato:
    name: contrato-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/github -p 'test_*.py'
      - if: github.event_name == 'pull_request'
        run: python3 scripts/github/validar_pr.py
  firestore:
    name: firestore-offline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Database/package-lock.json
      - run: npm ci
      - run: npm run test:firestore
  motores:
    name: motores-docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: python3 Database/docker/verificar.py
