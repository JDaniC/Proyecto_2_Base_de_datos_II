name: Fusion automatica de PR

on:
  workflow_run:
    workflows: [Validación del proyecto]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr:
        description: Número de PR; vacío para comprobar todos los abiertos
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: read
  statuses: write

concurrency:
  group: auto-merge-${{ github.event.issue.number || github.event.workflow_run.head_branch || inputs.pr || 'todos' }}
  cancel-in-progress: false

jobs:
  evaluar:
    name: Verificar Codex y activar integración
    if: >-
      github.event_name != 'issue_comment' ||
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Comprobar revisión del commit actual y activar auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/github/auto_merge.py
