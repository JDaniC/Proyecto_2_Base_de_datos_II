# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true
reviews:
  review_progress: true
  fail_commit_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "^main$"
  auto_approvals:
    enabled: true
    allow_author_approval: false
  path_instructions:
    - path: "**/*"
      instructions: |
        Revisa los cambios contra el ID y los criterios vigentes del PR.
        Usa AGENTS.md para las reglas técnicas. Distingue alcance vigente
        de fases históricas, ampliaciones y entregables académicos externos al PR.
        Sustenta cada hallazgo aplicable con el archivo y el comportamiento afectado.
        Para persistencia, comprueba aislamiento institucional, atomicidad e
        integridad de versiones. Si cambia el esquema, comprueba la migración
        y la compatibilidad de instalaciones nuevas y existentes.
